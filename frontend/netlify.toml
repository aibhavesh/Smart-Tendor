[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"
  NEXT_TELEMETRY_DISABLED = "1"

# This is a Next.js 16 application. Netlify automatically applies its current
# OpenNext adapter; do not add the legacy @netlify/plugin-nextjs configuration.
# Configure NEXT_PUBLIC_API_BASE_URL in Netlify's production environment with
# the public URL of the deployed backend API. It is inlined at build time.
