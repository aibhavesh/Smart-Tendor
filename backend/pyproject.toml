[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tender-intel"
version = "0.1.0"
description = "Tender Intelligence Platform — backend (domain / application / infrastructure / api)"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Maheshwari Computer" }]

dependencies = [
    # --- Web / API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    # --- Config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # --- Persistence ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "greenlet>=3.1",
    # --- Auth (email/password plus optional Google Identity Services) ---
    "pyjwt>=2.10",
    "authlib>=1.3",           # Google OAuth
    "httpx>=0.27",
    # --- Vector store / embeddings (Phase 5) ---
    "qdrant-client>=1.12",
    "fastembed>=0.4",         # bge-small-en-v1.5 (384-d) embeddings
    # --- Extraction (Phase 4) ---
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "openpyxl>=3.1",          # Excel bulk import
    # --- DI ---
    "dependency-injector>=4.42",
    # --- Observability ---
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "sentry-sdk>=2.17",
    "psutil>=6.0",            # host resources for system health (FR-607)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "aiosqlite>=0.20",        # in-memory async DB for tests
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-jose",
    "asgi-lifespan>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tender_intel"]

[tool.vercel]
entrypoint = "index:app"

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
# Alembic writes the migration scripts; don't hold generated code to our style.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["tender_intel"]

# ---------------------------------------------------------------------------
# mypy — strict-ish type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "pdfplumber.*",
    "fitz.*",
    "dependency_injector.*",
    "authlib.*",
    "openpyxl.*",
    "psutil.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "regression: locks a PRD Section 13/14 threshold (do not weaken without a PRD change)",
]
