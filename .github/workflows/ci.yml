name: CI

# The README documents these checks as running on every push and every pull
# request. They did not exist; this file is that promise kept.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes an in-flight run rather than queueing
# behind it, so a stale commit never reports on code that has already moved on.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        # The project declares its dependencies in pyproject.toml; requirements.txt
        # is a two-line stub that installs `.`.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests
        # No live database, no Docker: the suite runs against in-memory SQLite, an
        # in-memory Qdrant and the deterministic hash embedding provider.
        run: pytest

      - name: Lint
        run: ruff check src tests

      - name: Format
        run: ruff format --check src tests

      - name: Types
        run: mypy src

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        # typescript and @tailwindcss/postcss are build-time requirements and live
        # in devDependencies, so dev deps must be installed.
        run: npm ci --include=dev

      - name: Lint
        # Fails on a raw hex / rgb() / hsl() anywhere in src.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        # NEXT_PUBLIC_API_BASE_URL is inlined at build time, so a placeholder is
        # supplied rather than leaving it unset. `api.ts` no longer throws when it
        # is missing, but a real value keeps the bundle on its production path.
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  migrations:
    name: Migrations reach head on an empty database
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tender
          POSTGRES_PASSWORD: tender
          POSTGRES_DB: tender_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tender"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Upgrade to head
        # The migration tests exercise the chain over SQLite, but nothing proves
        # the chain applies cleanly to the real target database. This does.
        env:
          DATABASE_URL: postgresql+asyncpg://tender:tender@localhost:5432/tender_ci
          JWT_SECRET: ci-secret-value-long-enough-to-pass-gates
          ALLOWED_EMAIL_DOMAINS: example.com
          ENVIRONMENT: ci
          BOOTSTRAP_SUPER_ADMIN_EMAIL: ""
        working-directory: backend
        run: alembic upgrade head

      - name: Confirm head
        env:
          DATABASE_URL: postgresql+asyncpg://tender:tender@localhost:5432/tender_ci
          JWT_SECRET: ci-secret-value-long-enough-to-pass-gates
          ALLOWED_EMAIL_DOMAINS: example.com
          ENVIRONMENT: ci
        working-directory: backend
        run: |
          python - <<'PY'
          import asyncio
          import os

          import asyncpg

          async def main() -> None:
              dsn = os.environ["DATABASE_URL"].replace("postgresql+asyncpg://", "postgresql://")
              conn = await asyncpg.connect(dsn)
              try:
                  current = await conn.fetchval("select version_num from alembic_version")
                  tables = {
                      r["tablename"]
                      for r in await conn.fetch(
                          "select tablename from pg_tables where schemaname='public'"
                      )
                  }
              finally:
                  await conn.close()

              print(f"head is {current}")
              # audit_logs is restored by b1a4c7e2d903 and must survive the reduction
              # revision f0e1d2c3b4a5 that dropped it.
              assert "audit_logs" in tables, sorted(tables)
              print(f"{len(tables)} tables present, audit_logs included")

          asyncio.run(main())
          PY
